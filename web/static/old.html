<!doctype html>
<html>
    <head>
<!--      <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">-->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js" integrity="sha512-qTXRIMyZIFb8iQcfjXWCO8+M5Tbc38Qi5WzdPOYZHIlZpzBHG3L3by84BBBOiRGiEb7KKtAOAs5qYdUiZiQNNQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js'></script>
        <style>#cur {
            padding: 50px 0;
            text-align: center;
            font-family: sans-serif;
            font-size: 30px;
        }
        #curhumid {
            color: green;
        }
        #curtemp {
            color: blue;
        }
        #curpower {
            color: red;
        }
        #curtime {
            font-size: 10px;
        }
        </style>
    </head>
    <body>
    <div>
      <a href='javascript:;' onclick="dayChart()">24 hour</a>
      <a href='javascript:;' onclick="weekChart()">7 day</a>
      <a href='javascript:;' onclick="monthChart()">30 day</a>
      <a href='javascript:;' onclick="yearChart()">1 year</a>
      <a href='javascript:;' onclick="earlier()">&lt;&lt;</a>
      <a href='javascript:;' onclick="later()">&gt;&gt;</a>
    </div>
    <table width="100%">
      <tr>	
	<td>
	  <div id="wrapper">
	    <canvas id="chart"></canvas>
	  </div>
	</td>
	<td id=cur width="20%" valign="top">
          <div id=curtemp>--.- &deg;F</div>
          <div id=curhumid>--.- %</div>
          <div id=curpower>--- W</div>
          <div id=curtime>12:34pm</div>
	</td>
      </tr>
      <tr>
	<td align=center>
	  <div class=sechdr>Alarms</div>
	  <table id="alarms">
	    <thead>
	      <tr><th>Description</th><th>State</th></tr>
	    </thead>
	    <tbody>
	    </tbody>
	  </table>
	</td>
      </tr>
      </table>
	<script>
        
	  chart = new Chart('chart', {"type": "line",
                                      "data": {
					  "labels": [],
                                    "datasets": [
                                      {
                                        "label": "Humidity (%)",
                                        "yAxisID": "A",
                                        "fill": false,
                                        "backgroundColor": "rgba(0,255,0,1)",
                                        "borderColor": "rgba(0,255,0,1)",
                                        "pointRadius": 0,
                                        "data": []
                                      },
                                      {
                                        "label": "Temperature (F)",
                                        "yAxisID": "A",
                                        "fill": false,
                                        "backgroundColor": "rgba(0,0,255,1)",
                                        "borderColor": "rgba(0,0,255,1)",
                                        "pointRadius": 0,
                                        "data": []
                                      },
                                      {
                                        "label": "Power (W)",
                                        "yAxisID": "B",
                                        "fill": false,
                                        "backgroundColor": "rgba(255,0,0,1)",
                                        "borderColor": "rgba(255,0,0,1)",
                                        "pointRadius": 0,
                                        "data": []
                                      }
                                    ]
                                  },
                                  "options": {
                                    "title": {
                                      "display": true,
                                      "text": "Loading..."
                                    },
                                    "scales": {
                                      "xAxes": [
                                        {
                                          "type": "time",
                                          "time": {
                                            "unit": "hour"
                                          },
                                          "display": true,
                                          "scaleLabel": {
                                            "display": true,
                                            "labelString": "Date"
                                          }
                                        }
                                      ],
                                      "yAxes": [
                                        {
                                          "id": "A",
                                          "type": "linear",
                                          "position": "left",
                                          "ticks": {
                                            "max": 100,
                                            "min": 0
                                          }
                                        },
                                        {
                                          "id": "B",
                                          "type": "linear",
                                          "position": "right",
                                          "ticks": {
                                            "max": 1000,
                                            "min": 0
                                          }
                                        }
                                      ]
                                    }
                                  }
                                });

function makeChart(readings) {
      var timeLabels = readings.map(function(d) {
              return new Date(d[0]);
            });
      var humidData = readings.map(function(d) {
              return +d[1];
            });
      var tempData = readings.map(function(d) {
              return +d[2];
            });
      var powerData = readings.map(function(d) {
              return +d[3];
            });
        chart.data.labels = timeLabels;
        chart.data.datasets[0].data = humidData;
        chart.data.datasets[1].data = tempData;
        chart.data.datasets[2].data = powerData;
        chart.options.title.text = startDate.toLocaleString('en-US', dateFormat) + " - " +
                                   endDate.toLocaleString('en-US', dateFormat);
        chart.update();
}

function drawChart() {
    startDate = new Date(endDate-days*86400*1000); 
    var jsonData = $.ajax({
      url: dataUrl( rollup, startDate, endDate),
      dataType: 'json',
    }).done(makeChart);
}

function dataUrl(rollup, start, end) {
    return '/api/v1.0/measurements?rollup=' + rollup + '&start=' + start.toISOString() + '&end=' + end.toISOString();
}

      function dayChart() {
    rollup = 'hour';
    days = 1;
    chart.options.scales.xAxes[0].time.unit = 'hour';
    drawChart();
}

function weekChart() {
    rollup = 'hour';
    days = 7;
    chart.options.scales.xAxes[0].time.unit = 'day';
    drawChart();
}

function monthChart() {
    rollup = 'day';
    days = 30;
    chart.options.scales.xAxes[0].time.unit = 'day';
    drawChart();
}

function yearChart() {
    rollup = 'day';
    days = 365;
    chart.options.scales.xAxes[0].time.unit = 'month';
    drawChart();
}

function earlier() {
    endDate = new Date(endDate.valueOf() - days*86400*1000);
    drawChart();
}

function later() {
    endDate = new Date(endDate.valueOf() + days*86400*1000);
    drawChart();
}
  
function loadLatest() {
    var jsonData = $.ajax({
      url: '/api/v1.0/latest',
      dataType: 'json',
    }).done(function(data){
        var d = new Date(data['time']);
        if (Date.now() - d < 86400*1000) {
            document.getElementById("curhumid").innerText=data['humidity'].toFixed(1) + " %";
            document.getElementById("curtemp").innerText=data['temperature'].toFixed(0) + " \xB0";
            document.getElementById("curpower").innerText=data['power'].toFixed(0) + " W";
            document.getElementById("curtime").innerText=d.toLocaleString('en-US', timeFormat);
        }
    });
}
	  function loadAlarms() {
	      $.ajax({
		  url: '/api/v1.0/alarms',
		  dataType: 'json',
		  success: function(data) {
		      const $tableBody = $('#alarms');
		      console.log($tableBody);
		      $tableBody.empty();
//		      $tableBody.removeData();
		      $.each(data, function(index, alarm) {
			  const row = `<tr><td>${alarm.message}</td>
<td>${alarm.state}</td></tr>`;
			  //			  $tableBody.append(row);
			  $tableBody.append(row);
		      });
		  }
		  // error: TODO
	      });
	  };

			     
	  var timeFormat = {hour: '2-digit', minute:'2-digit', second:'2-digit'};
	  var dateFormat = {day: '2-digit', month:'2-digit', year:'2-digit'};
	  var endDate = new Date();
	  var startDate = new Date();
	  var days = 1;
	  var rollup = 'minute';

	  loadLatest();
	  loadAlarms();
	  dayChart(); 
	  setInterval(loadLatest, 15000);
	  setInterval(loadAlarms, 5000);
	  </script>
    </body>
</html>
